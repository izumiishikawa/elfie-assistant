# Recompila o ElfieSetup.exe e publica como Release sempre que um commit com
# "deploy" na mensagem chega na main.
#
# Roda no ubuntu-latest com Docker, chamando o MESMO installer/build.sh usado
# localmente, em vez de um runner windows-latest com o Inno instalado por choco:
# um caminho de build só, então o exe publicado é gerado exatamente como o que
# você testa na sua máquina.
#
# NÃO commita nada de volta no repositório. Seria conveniente manter o
# installer/ElfieSetup.exe versionado sempre em dia por aqui, mas o commit sairia
# como github-actions[bot] e o bot entraria na lista de contribuidores do repo —
# exatamente o que foi limpo à mão em 2026-09-07. O binário versionado continua
# sendo responsabilidade do build local (installer/build.sh já o atualiza).

name: Release installer

on:
  push:
    branches: [main]
  workflow_dispatch:      # permite disparar na mão, sem precisar de um commit

permissions:
  contents: write         # necessário para criar a Release

jobs:
  build:
    # Comparação de string em expressão do GitHub é case-insensitive, então
    # "deploy", "Deploy" e "deploy(feat: ...)" disparam igual.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'deploy')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the installer
        run: ./installer/build.sh

      - name: Check the exe was produced
        run: |
          test -f dist/ElfieSetup.exe || { echo "::error::dist/ElfieSetup.exe was not produced"; exit 1; }
          ls -lh dist/ElfieSetup.exe

      - name: Read the version from elfie.iss
        id: meta
        run: |
          version="$(sed -n 's/^#define[[:space:]]\+AppVersion[[:space:]]\+"\(.*\)"/\1/p' installer/elfie.iss)"
          test -n "$version" || { echo "::error::AppVersion not found in installer/elfie.iss"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # run_number no fim porque AppVersion é bumpado à mão: sem ele, dois
          # deploys seguidos sem bump colidiriam na mesma tag e o segundo falharia.
          echo "tag=v$version-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Windows installer, built from \`${GITHUB_SHA:0:7}\`.

          Download \`ElfieSetup.exe\` below and run it. It installs the API, the
          web app and the desktop daemon, along with private copies of Node.js,
          Python, ffmpeg and MongoDB, and leaves a tray icon that starts and stops
          the three of them. No administrator rights are needed, except one prompt
          for MongoDB that you can skip if you already have a database.

          Setup downloads those runtimes from their official sites and resolves the
          npm/pip dependencies on your machine, so it needs an internet connection
          and takes 5 to 20 minutes.

          Windows will show a SmartScreen warning because the executable is not
          code-signed: **More info → Run anyway**.

          ---

          $(git log -1 --pretty=%B)
          EOF

          gh release create "${{ steps.meta.outputs.tag }}" \
            dist/ElfieSetup.exe \
            --title "Elfie v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})" \
            --notes-file notes.md
