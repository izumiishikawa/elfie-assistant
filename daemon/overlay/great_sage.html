<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, CX, CY;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2; CY = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  let targetEnergy = 0, energy = 0;
  let mode = 'idle';
  const STATE_BUCKET = {
    processing: 'processing',
    transcribing: 'processing',
    speaking: 'speaking',
  };

  let closing = false, closeFrames = 0;
  const CLOSE_DURATION_FRAMES = 26;

  function closingFactors() {
    if (!closing) return { scale: 1, alpha: 1 };
    const p = Math.min(1, closeFrames / CLOSE_DURATION_FRAMES);
    let scale, alpha;
    if (p < 0.12) {
      const k = p / 0.12;
      scale = 1 + k * 0.14;
      alpha = 1;
    } else {
      const k = (p - 0.12) / 0.88;
      scale = 1.14 - k * 1.12;
      alpha = 1 - k;
    }
    return { scale: Math.max(0.001, scale), alpha: Math.max(0, alpha) };
  }

  let opening = true, openFrames = 0;
  const OPEN_DURATION_FRAMES = 34;

  function openingFactors() {
    if (!opening) return { scale: 1, alpha: 1 };
    const p = Math.min(1, openFrames / OPEN_DURATION_FRAMES);
    let scale, alpha;
    if (p < 0.7) {
      const k = p / 0.7;
      scale = k * 1.18;
      alpha = Math.min(1, k * 1.6);
    } else {
      const k = (p - 0.7) / 0.3;
      scale = 1.18 - k * 0.18;
      alpha = 1;
    }
    return { scale: Math.max(0.02, scale), alpha: Math.max(0, Math.min(1, alpha)) };
  }

  window.setEnergy = function (v) {
    targetEnergy = Math.max(0, Math.min(1, Number(v) || 0));
  };
  window.setState = function (name) {
    if (name === 'closing') {
      if (!closing) { closing = true; closeFrames = 0; }
      return;
    }
    mode = STATE_BUCKET[name] || 'idle';
  };

  let kanjiCue = null; // { char, t0 }
  const KANJI_FORM_MS  = 550;
  const KANJI_HOLD_MS  = 1400;
  const KANJI_FADE_MS  = 450;
  const KANJI_LAYERS   = 6;

  window.showKanji = function (ch) {
    const s = String(ch == null ? '' : ch).trim();
    if (!s) return;
    kanjiCue = { char: s.slice(0, 3), t0: performance.now() };
  };

  function drawKanjiCube(now) {
    if (!kanjiCue) return;
    const elapsed = now - kanjiCue.t0;
    const total = KANJI_FORM_MS + KANJI_HOLD_MS + KANJI_FADE_MS;
    if (elapsed > total) { kanjiCue = null; return; }

    let formP = 1, boxAlpha = 1, charAlpha = 1;
    if (elapsed < KANJI_FORM_MS) {
      formP = elapsed / KANJI_FORM_MS;
      charAlpha = Math.max(0, (formP - 0.55) / 0.45);
    } else if (elapsed >= KANJI_FORM_MS + KANJI_HOLD_MS) {
      const fp = (elapsed - KANJI_FORM_MS - KANJI_HOLD_MS) / KANJI_FADE_MS;
      boxAlpha = 1 - fp;
      charAlpha = 1 - fp;
    }

    const size = Math.min(W, H) * 0.17;
    const layerH = size / KANJI_LAYERS;

    ctx.save();
    ctx.translate(CX, CY);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = boxAlpha;

    ctx.fillStyle = 'rgba(4,5,9,0.94)';
    ctx.strokeStyle = 'rgba(195,228,255,0.9)';
    ctx.lineWidth = 2;

    const layersShown = Math.ceil(formP * KANJI_LAYERS);
    for (let i = 0; i < layersShown; i++) {
      const layerP = Math.min(1, formP * KANJI_LAYERS - i);
      const w = size * (0.25 + layerP * 0.75);
      const y = -size / 2 + i * layerH;
      ctx.fillRect(-w / 2, y, w, layerH + 0.6);
    }
    ctx.strokeRect(-size / 2, -size / 2, size, size * Math.min(1, formP * KANJI_LAYERS / KANJI_LAYERS));

    if (charAlpha > 0.01) {
      ctx.globalAlpha = boxAlpha * charAlpha;
      ctx.fillStyle = '#f5f8ff';
      ctx.font = `${Math.floor(size * 0.5)}px "Noto Sans JP", "Noto Sans CJK JP", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(kanjiCue.char, 0, 0);
    }

    ctx.restore();
  }


  // ── Losango de ferramenta ─────────────────────────────────────────────────
  // Parente do cubo do kanji acima, mas com semantica oposta: o kanji e um CUE
  // (pisca e some sozinho, cronometrado), isso aqui e um ESTADO — "ela esta
  // executando tal ferramenta AGORA" — entao forma, fica o tempo que a
  // ferramenta durar, e so sai quando chega showToolIcon(null).
  //
  // A CAIXA gira 45 graus; o icone NAO gira junto. Um icone inclinado no
  // tamanho que sobra dentro de um losango pequeno fica ilegivel, e o ponto do
  // icone e ser reconhecido de relance.
  //
  // Icones sao path vetorial em canvas, nao emoji nem fonte de icone: o overlay
  // roda em WebKit2 no Linux e WebView2 no Windows, e depender de uma familia de
  // fonte instalada daria tofu (caixinha) numa das duas sem aviso nenhum.

  const TOOL_FORM_MS  = 420;
  const TOOL_FADE_MS  = 320;
  const TOOL_SWAP_MS  = 200;
  const TOOL_LAYERS   = 6;

  let toolCue = null; // { icon, t0, out, swapAt }

  // Cada icone desenha numa grade de -1..1 com o centro em (0,0); quem chama
  // cuida da escala, da cor e da espessura.
  const ICON = {
    search(c) {
      c.beginPath(); c.arc(-0.18, -0.18, 0.58, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.moveTo(0.24, 0.24); c.lineTo(0.82, 0.82); c.stroke();
    },
    globe(c) {
      c.beginPath(); c.arc(0, 0, 0.82, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.moveTo(-0.82, 0); c.lineTo(0.82, 0); c.stroke();
      c.beginPath(); c.ellipse(0, 0, 0.40, 0.82, 0, 0, Math.PI * 2); c.stroke();
    },
    camera(c) {
      c.beginPath();
      c.moveTo(-0.85, -0.28); c.lineTo(-0.48, -0.28); c.lineTo(-0.32, -0.58);
      c.lineTo(0.32, -0.58);  c.lineTo(0.48, -0.28);  c.lineTo(0.85, -0.28);
      c.lineTo(0.85, 0.62);   c.lineTo(-0.85, 0.62);  c.closePath(); c.stroke();
      c.beginPath(); c.arc(0, 0.16, 0.30, 0, Math.PI * 2); c.stroke();
    },
    eye(c) {
      c.beginPath();
      c.moveTo(-0.90, 0);
      c.quadraticCurveTo(0, -0.74, 0.90, 0);
      c.quadraticCurveTo(0, 0.74, -0.90, 0);
      c.closePath(); c.stroke();
      c.beginPath(); c.arc(0, 0, 0.25, 0, Math.PI * 2); c.fill();
    },
    terminal(c) {
      c.beginPath(); c.rect(-0.88, -0.66, 1.76, 1.32); c.stroke();
      c.beginPath(); c.moveTo(-0.50, -0.22); c.lineTo(-0.14, 0.06); c.lineTo(-0.50, 0.34); c.stroke();
      c.beginPath(); c.moveTo(0.08, 0.34); c.lineTo(0.56, 0.34); c.stroke();
    },
    sparkle(c) {
      c.beginPath();
      c.moveTo(0, -0.95);
      c.quadraticCurveTo(0.13, -0.13, 0.95, 0);
      c.quadraticCurveTo(0.13, 0.13, 0, 0.95);
      c.quadraticCurveTo(-0.13, 0.13, -0.95, 0);
      c.quadraticCurveTo(-0.13, -0.13, 0, -0.95);
      c.fill();
    },
    pencil(c) {
      c.beginPath();
      c.moveTo(-0.78, 0.78); c.lineTo(-0.60, 0.18); c.lineTo(0.40, -0.82);
      c.lineTo(0.82, -0.40); c.lineTo(-0.18, 0.60); c.closePath(); c.stroke();
      c.beginPath(); c.moveTo(-0.60, 0.18); c.lineTo(-0.18, 0.60); c.stroke();
    },
    trash(c) {
      c.beginPath(); c.moveTo(-0.80, -0.50); c.lineTo(0.80, -0.50); c.stroke();
      c.beginPath();
      c.moveTo(-0.30, -0.50); c.lineTo(-0.30, -0.82); c.lineTo(0.30, -0.82); c.lineTo(0.30, -0.50);
      c.stroke();
      c.beginPath();
      c.moveTo(-0.58, -0.50); c.lineTo(-0.46, 0.82); c.lineTo(0.46, 0.82); c.lineTo(0.58, -0.50);
      c.stroke();
    },
    flask(c) {
      c.beginPath();
      c.moveTo(-0.30, -0.80); c.lineTo(-0.30, -0.14); c.lineTo(-0.76, 0.64);
      c.quadraticCurveTo(-0.88, 0.86, -0.60, 0.86);
      c.lineTo(0.60, 0.86);
      c.quadraticCurveTo(0.88, 0.86, 0.76, 0.64);
      c.lineTo(0.30, -0.14); c.lineTo(0.30, -0.80);
      c.stroke();
      c.beginPath(); c.moveTo(-0.48, -0.80); c.lineTo(0.48, -0.80); c.stroke();
    },
    waveform(c) {
      const bars = [0.32, 0.60, 0.92, 0.52, 0.24];
      for (let i = 0; i < bars.length; i++) {
        const x = -0.72 + i * 0.36;
        c.beginPath(); c.moveTo(x, -bars[i]); c.lineTo(x, bars[i]); c.stroke();
      }
    },
    picture(c) {
      c.beginPath(); c.rect(-0.85, -0.64, 1.70, 1.28); c.stroke();
      c.beginPath(); c.arc(-0.38, -0.22, 0.17, 0, Math.PI * 2); c.stroke();
      c.beginPath();
      c.moveTo(-0.85, 0.42); c.lineTo(-0.20, -0.14); c.lineTo(0.24, 0.24);
      c.lineTo(0.52, 0.02); c.lineTo(0.85, 0.34); c.stroke();
    },
    gear(c) {
      c.beginPath(); c.arc(0, 0, 0.50, 0, Math.PI * 2); c.stroke();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        c.beginPath();
        c.moveTo(Math.cos(a) * 0.56, Math.sin(a) * 0.56);
        c.lineTo(Math.cos(a) * 0.90, Math.sin(a) * 0.90);
        c.stroke();
      }
      c.beginPath(); c.arc(0, 0, 0.17, 0, Math.PI * 2); c.stroke();
    },
  };

  const TOOL_ICONS = {
    web_search: ICON.search,
    web_fetch: ICON.globe,
    browse_screenshot: ICON.camera,
    computer_screenshot: ICON.camera,
    see_image: ICON.eye,
    execute_command: ICON.terminal,
    forge_skill: ICON.sparkle,
    edit_skill: ICON.pencil,
    delete_skill: ICON.trash,
    test_skill: ICON.flask,
    change_voice: ICON.waveform,
    list_voices: ICON.waveform,
    generate_anime_image: ICON.picture,
  };

  // As dynamic skills tem nome definido pelo usuario em tempo de execucao, entao
  // uma tabela fixa nunca vai cobrir todas. Casar por pedaco do nome faz uma
  // skill nova nascer com um icone plausivel em vez de cair sempre na engrenagem.
  const TOOL_PATTERNS = [
    [/screenshot|capture|print/, ICON.camera],
    [/search|find|lookup/,       ICON.search],
    [/fetch|browse|browser|url|http|web/, ICON.globe],
    [/image|photo|draw|paint|art/, ICON.picture],
    [/voice|speak|audio|tts/,    ICON.waveform],
    [/command|shell|exec|run|bash/, ICON.terminal],
    [/test|check|verify/,        ICON.flask],
    [/delete|remove|drop/,       ICON.trash],
    [/edit|update|write|patch/,  ICON.pencil],
    [/skill|forge|create|new/,   ICON.sparkle],
    [/see|look|watch|vision|eye/, ICON.eye],
  ];

  function iconFor(name) {
    if (TOOL_ICONS[name]) return TOOL_ICONS[name];
    for (const [re, icon] of TOOL_PATTERNS) if (re.test(name)) return icon;
    return ICON.gear;
  }

  window.showToolIcon = function (name) {
    const key = String(name == null ? '' : name).trim().toLowerCase();
    if (!key) {
      if (toolCue && !toolCue.out) toolCue.out = performance.now();
      return;
    }
    const icon = iconFor(key);
    if (toolCue && !toolCue.out) {
      // Uma rodada com varias ferramentas em sequencia nao deve refazer a
      // animacao de entrada a cada troca — a caixa fica, so o icone troca.
      if (toolCue.icon !== icon) { toolCue.icon = icon; toolCue.swapAt = performance.now(); }
      return;
    }
    toolCue = { icon, t0: performance.now(), out: 0, swapAt: 0 };
  };

  function drawToolDiamond(now) {
    if (!toolCue) return;

    // Espera o cubo do kanji sair antes de comecar a formar. Na PRIMEIRA
    // ferramenta de cada turno o daemon dispara _cue_great_sage('ryo') e
    // _show_tool_activity() com dois frames de diferenca (ver elfie_daemon.py,
    // ~1456), e os dois desenham no mesmo centro — sem isso o '了' e o losango
    // aparecem empilhados. Empurrar o t0 a cada frame deixa a entrada do
    // losango intacta, so atrasada.
    if (kanjiCue && !toolCue.out) { toolCue.t0 = now; return; }

    const inP = Math.min(1, (now - toolCue.t0) / TOOL_FORM_MS);
    let alpha = 1;
    if (toolCue.out) {
      const p = (now - toolCue.out) / TOOL_FADE_MS;
      if (p >= 1) { toolCue = null; return; }
      alpha = 1 - p;
    }

    const size = Math.min(W, H) * 0.155;
    // Respiracao lenta: um web_fetch de 15s com a caixa completamente estatica
    // fica indistinguivel de uma interface travada.
    const breath = 1 + Math.sin(now / 620) * 0.022;

    ctx.save();
    ctx.translate(CX, CY);
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.rotate(Math.PI / 4);
    ctx.scale(breath, breath);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(4,5,9,0.94)';
    ctx.strokeStyle = 'rgba(195,228,255,0.9)';
    ctx.lineWidth = 2;
    const layerH = size / TOOL_LAYERS;
    const layers = Math.ceil(inP * TOOL_LAYERS);
    for (let i = 0; i < layers; i++) {
      const lp = Math.min(1, inP * TOOL_LAYERS - i);
      const w = size * (0.25 + lp * 0.75);
      ctx.fillRect(-w / 2, -size / 2 + i * layerH, w, layerH + 0.6);
    }
    if (inP > 0.35) {
      ctx.globalAlpha = alpha * Math.min(1, (inP - 0.35) / 0.65);
      ctx.strokeRect(-size / 2, -size / 2, size, size);
    }
    ctx.restore();

    let iconA = alpha * Math.max(0, (inP - 0.5) / 0.5);
    if (toolCue.swapAt) iconA *= Math.min(1, (now - toolCue.swapAt) / TOOL_SWAP_MS);
    if (iconA > 0.01) {
      ctx.globalAlpha = iconA;
      ctx.strokeStyle = '#eaf4ff';
      ctx.fillStyle = '#eaf4ff';
      // O maior quadrado RETO que cabe num losango de lado `size` tem lado
      // size/raiz(2); o 0.5 leva pro raio da grade -1..1 e o 0.72 e a folga
      // pra ponta do icone nao encostar na aresta.
      const s = (size / Math.SQRT2) * 0.5 * 0.72;
      ctx.save();
      ctx.scale(s, s);
      ctx.lineWidth = 0.15;   // em unidades da grade, ja que o scale veio antes
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      toolCue.icon(ctx);
      ctx.restore();
    }

    ctx.restore();
  }

  const PHI = (1 + Math.sqrt(5)) / 2;
  const rawVerts = [
    [-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
    [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
    [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1],
  ];
  const verts = rawVerts.map(([x, y, z]) => {
    const l = Math.hypot(x, y, z);
    return [x / l, y / l, z / l];
  });
  const edges = [
    [0,1],[0,5],[0,7],[0,10],[0,11],
    [1,5],[1,7],[1,8],[1,9],
    [2,3],[2,4],[2,6],[2,10],[2,11],
    [3,4],[3,6],[3,8],[3,9],
    [4,5],[4,9],[4,11],
    [5,9],[5,11],
    [6,7],[6,8],[6,10],
    [7,8],[7,10],
    [8,9],
    [10,11],
  ];

  function rotatePoint([x, y, z], ax, ay, az) {
    let y1 = y * Math.cos(ax) - z * Math.sin(ax);
    let z1 = y * Math.sin(ax) + z * Math.cos(ax);
    let x2 = x * Math.cos(ay) + z1 * Math.sin(ay);
    let z2 = -x * Math.sin(ay) + z1 * Math.cos(ay);
    let x3 = x2 * Math.cos(az) - y1 * Math.sin(az);
    let y3 = x2 * Math.sin(az) + y1 * Math.cos(az);
    return [x3, y3, z2];
  }
  function project([x, y, z], scale, dist) {
    const f = dist / (dist - z);
    return [x * f * scale, y * f * scale];
  }

  const particles = [];
  function spawnParticle() {
    particles.push({
      angle: Math.random() * Math.PI * 2,
      speed: 0.35 + Math.random() * 0.9,
      r: 6 + Math.random() * 8,
      size: 0.8 + Math.random() * 1.8,
      life: 1,
      decay: 0.003 + Math.random() * 0.006,
    });
  }

  function drawRing(radius, rot, squash, color, dash, width) {
    ctx.save();
    ctx.rotate(rot);
    ctx.scale(1, squash);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.ellipse(0, 0, radius, radius, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function simulateProcessing(t) {
    const a = Math.sin(t * 5.2) * 0.5 + 0.5;
    const b = Math.sin(t * 9.7 + 1.1) * 0.5 + 0.5;
    return 0.35 + 0.35 * a + 0.2 * b;
  }
  function simulateSpeaking(t) {
    const s1 = Math.sin(t * 15.0) * 0.5 + 0.5;
    const s2 = Math.sin(t * 7.3 + 1.3) * 0.5 + 0.5;
    const s3 = Math.sin(t * 3.1 + 2.7) * 0.5 + 0.5;
    const envelope = 0.6 + 0.4 * Math.sin(t * 1.6);
    let v = (s1 * 0.5 + s2 * 0.3 + s3 * 0.2) * envelope;
    if ((t * 1.7) % 3 < 0.16) v *= 0.25;
    return Math.max(0, Math.min(1, v));
  }

  let t = 0;
  let rotX = Math.random() * 10, rotY = Math.random() * 10, rotZ = Math.random() * 10;
  let ringRot1 = 0, ringRot2 = Math.PI / 3;
  let modeScale = 1;

  function draw(dt, nowMs) {
    ctx.clearRect(0, 0, W, H);
    energy += (targetEnergy - energy) * 0.08;

    let level = energy;
    let spinMul = 1;
    if (mode === 'processing') { level = simulateProcessing(t); spinMul = 2.4; }
    else if (mode === 'speaking') { level = simulateSpeaking(t); spinMul = 1.5; }

    const modeScaleTarget = mode === 'processing' ? 0.5 : 1;
    modeScale += (modeScaleTarget - modeScale) * 0.12;

    const { scale: openScale, alpha: openAlpha } = openingFactors();
    if (opening) { openFrames++; if (openFrames >= OPEN_DURATION_FRAMES) opening = false; }
    const { scale: closeScale, alpha: closeAlpha } = closingFactors();
    if (closing) closeFrames++;
    const transitionScale = openScale * closeScale;
    const transitionAlpha = openAlpha * closeAlpha;
    const baseR = Math.min(W, H) * 0.30 * transitionScale * modeScale;
    const coreR = baseR * 0.20 * (1 + level * 0.5);

    ctx.save();
    ctx.globalAlpha = transitionAlpha;
    ctx.translate(CX, CY);
    ctx.globalCompositeOperation = 'lighter';

    const rayCount = 14;
    for (let i = 0; i < rayCount; i++) {
      const a = (i / rayCount) * Math.PI * 2 + t * 0.05 * spinMul;
      const len = baseR * (1.25 + 0.5 * Math.sin(t * 1.3 + i)) * (0.55 + level * 0.9);
      const grad = ctx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
      grad.addColorStop(0, 'rgba(220,255,235,0.5)');
      grad.addColorStop(1, 'rgba(220,255,235,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1 + level;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.stroke();
    }

    ringRot1 += (0.006 + level * 0.012) * spinMul;
    ringRot2 -= (0.004 + level * 0.009) * spinMul;
    drawRing(baseR * (0.88 + level * 0.3), ringRot1, 0.34, 'rgba(200,255,225,0.55)', [18, 9, 4, 9], 3.2);
    drawRing(baseR * (0.98 + level * 0.38), ringRot2, 0.55, 'rgba(180,255,255,0.45)', [24, 7], 2.6);

    rotX += (0.12 + level * 0.05) * dt * spinMul;
    rotY += (0.18 + level * 0.08) * dt * spinMul;
    rotZ += (0.07 + level * 0.03) * dt * spinMul;
    const dist = 3;
    const proj = verts.map((v) => project(rotatePoint(v, rotX, rotY, rotZ), coreR * 2.4, dist));
    ctx.strokeStyle = `rgba(255,255,255,${0.55 + level * 0.3})`;
    ctx.lineWidth = 1.1;
    for (const [a, b] of edges) {
      ctx.beginPath();
      ctx.moveTo(proj[a][0], proj[a][1]);
      ctx.lineTo(proj[b][0], proj[b][1]);
      ctx.stroke();
    }

    const spawnChance = mode === 'processing' ? 0.22 + level * 0.5 : 0.12 + level * 0.5;
    if (Math.random() < spawnChance) spawnParticle();
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.r += p.speed * (1 + level * 2.2);
      p.life -= p.decay;
      if (p.life <= 0 || p.r > baseR * 2.3) { particles.splice(i, 1); continue; }
      const x = Math.cos(p.angle) * p.r, y = Math.sin(p.angle) * p.r;
      ctx.fillStyle = `rgba(230,255,240,${p.life * 0.8})`;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    const glowR = coreR * (2.1 + level * 1.6);
    const grad2 = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
    grad2.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad2.addColorStop(0.25, 'rgba(220,255,235,0.55)');
    grad2.addColorStop(1, 'rgba(220,255,235,0)');
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    drawKanjiCube(nowMs);
    drawToolDiamond(nowMs);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;
    draw(dt, now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
