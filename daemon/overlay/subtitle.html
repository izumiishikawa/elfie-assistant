<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function log(msg) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.elfieLog) {
        window.webkit.messageHandlers.elfieLog.postMessage(String(msg));
      }
    } catch (e) {  }
  }
  window.onerror = function (msg, url, line, col, error) {
    log('JS ERROR: ' + msg + ' @ line ' + line + (error && error.stack ? '\n' + error.stack : ''));
    return false;
  };
  log('subtitle.html loaded, window ' + window.innerWidth + 'x' + window.innerHeight);

  const FONT_SIZE     = 15;
  const FONT_WEIGHT    = '800';
  const FONT_STACK     = `"Noto Sans JP", "Noto Sans CJK JP", "Noto Sans", sans-serif`;
  const TEXT_COLOR     = '#000000';
  const OUTLINE_COLOR  = '#ffffff';
  const OUTLINE_SIZE   = 3;
  const LINE_HEIGHT    = FONT_SIZE * 1.25;

  const WORDS_PER_CHUNK   = 3;
  const MIN_CHUNK_HOLD    = 0.45;
  const APPEAR_STAGGER    = 0.035;
  const FALL_SETTLE_TIME  = 0.55;
  const VANISH_FADE_TIME  = 0.35;
  const WORDS_PER_SECOND  = 2.9;
  const CJK_CHARS_PER_SECOND = 3.2;

  function cp(n) { return String.fromCodePoint(n); }
  const CJK_RANGES = [
    [0x3040, 0x30ff],
    [0x3400, 0x4dbf],
    [0x4e00, 0x9fff],
    [0xf900, 0xfaff],
    [0xff66, 0xff9f],
  ];
  const CJK_RE = new RegExp('[' + CJK_RANGES.map(([lo, hi]) => cp(lo) + '-' + cp(hi)).join('') + ']');
  function isCjkToken(tok) { return tok.str.length === 1 && CJK_RE.test(tok.str); }

  function tokenize(text) {
    const tokens = [];
    let i = 0;
    let sp = false;
    while (i < text.length) {
      const ch = text[i];
      if (ch === ' ') { sp = true; i++; continue; }
      if (CJK_RE.test(ch)) {
        tokens.push({ str: ch, sp });
        sp = false;
        i++;
        continue;
      }
      let j = i + 1;
      while (j < text.length && text[j] !== ' ' && !CJK_RE.test(text[j])) j++;
      tokens.push({ str: text.slice(i, j), sp });
      sp = false;
      i = j;
    }
    return tokens;
  }

  function joinTokens(tokens) {
    let s = '';
    for (let i = 0; i < tokens.length; i++) {
      if (i > 0 && tokens[i].sp) s += ' ';
      s += tokens[i].str;
    }
    return s;
  }

  const textAreaLeft   = () => W * 0.05;
  const textAreaRight  = () => W * 0.95;
  const textBaselineY  = () => H * 0.40;
  const floorY         = () => H * 0.86;

  function easeOutBack(x) {
    const s = 1.70158;
    x -= 1;
    return 1 + (s + 1) * x * x * x + s * x * x;
  }
  function easeInBack(x) {
    const s = 1.70158;
    return x * x * ((s + 1) * x - s);
  }
  function easeOutSine(x) { return Math.sin(x * Math.PI / 2); }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  ctx.font = `${FONT_WEIGHT} ${FONT_SIZE}px ${FONT_STACK}`;
  function measureW(s) { return ctx.measureText(s).width; }

  function layoutText(text) {
    const maxW = textAreaRight() - textAreaLeft();
    const spaceW = measureW(' ');
    const tokens = tokenize(text);
    const lines = [];
    let current = [];
    let currentW = 0;
    for (const tok of tokens) {
      const w = measureW(tok.str);
      let extra = (current.length > 0 && tok.sp) ? spaceW : 0;
      if (current.length > 0 && currentW + extra + w > maxW) {
        lines.push(current);
        current = [];
        currentW = 0;
        extra = 0;
      }
      current.push(tok);
      currentW += extra + w;
    }
    if (current.length > 0) lines.push(current);

    const numLines = lines.length;
    const startY = textBaselineY() - (numLines - 1) * LINE_HEIGHT;

    const result = [];
    for (let li = 0; li < lines.length; li++) {
      const lineText = joinTokens(lines[li]);
      const lineW = measureW(lineText);
      let x = textAreaLeft() + Math.max(0, (maxW - lineW) / 2);
      const y = startY + li * LINE_HEIGHT;
      for (const ch of lineText) {
        const chW = measureW(ch);
        if (ch !== ' ') result.push({ char: ch, x, y });
        x += chW;
      }
    }
    return result;
  }

  let t = 0;
  let generation = 0;
  let nextBatchId = 1;
  const activeBatches = new Map();
  const allLetters = [];

  function updateTumble(letter, dt) {
    if (letter.tumbleDone) { letter.tumbleScaleY = letter.restScaleY; return; }
    letter.flipElapsed += dt;
    const flipTime = letter.flipTime;
    const totalFlipPhase = letter.flips * 2 * flipTime;
    if (letter.flipElapsed < totalFlipPhase) {
      const cycle = letter.flipElapsed % (2 * flipTime);
      if (cycle < flipTime) {
        letter.tumbleScaleY = 1 - (cycle / flipTime) * 0.96;
      } else {
        letter.tumbleScaleY = 0.04 + ((cycle - flipTime) / flipTime) * 0.96;
      }
    } else {
      const settleP = clamp01((letter.flipElapsed - totalFlipPhase) / (flipTime * 1.5));
      letter.tumbleScaleY = 1 + (letter.restScaleY - 1) * settleP;
      if (settleP >= 1) letter.tumbleDone = true;
    }
  }

  function startFall(letter) {
    letter.phase = 'falling';
    const strength = 0.4 + Math.random() * 1.3;
    letter.vx = (Math.random() * 2 - 1) * 160 * strength;
    letter.vy = -(30 + Math.random() * 230) * strength;
    letter.angVel = (Math.random() * 2 - 1) * 7.5 * strength;
    letter.landed = false;
    letter.flips = 1 + Math.floor(Math.random() * 3);
    letter.flipTime = (0.09 + Math.random() * 0.07) / Math.max(strength, 0.5);
    letter.lyingDown = Math.random() < 0.55;
    letter.restScaleY = letter.lyingDown ? (0.06 + Math.random() * 0.16) : (0.7 + Math.random() * 0.3);
    letter.flipElapsed = 0;
    letter.tumbleScaleY = 1;
    letter.tumbleDone = false;
  }

  function dropBatch(batchId) {
    const batch = activeBatches.get(batchId);
    if (!batch) return;
    activeBatches.delete(batchId);
    for (const letter of batch) {
      if (letter.phase !== 'dead') startFall(letter);
    }
  }

  function showNow(text, duration, gen) {
    if (gen !== generation) {
      log('showNow SKIPPED (superseded): ' + JSON.stringify(text) + ' gen=' + gen + ' current=' + generation);
      return;
    }
    const layout = layoutText(text);
    log('showNow: ' + JSON.stringify(text) + ' -> ' + layout.length + ' visible chars, duration=' + duration.toFixed(2));
    if (layout.length === 0) {
      log('showNow: layoutText produced 0 chars, nothing to render for ' + JSON.stringify(text));
      return;
    }
    const batchId = nextBatchId++;
    const batch = [];
    layout.forEach((item, i) => {
      const letter = {
        char: item.char,
        x: item.x, y: item.y,
        rot0: (Math.random() * 2 - 1) * 0.15,
        rot: (Math.random() * 2 - 1) * 0.15,
        popScale: 1.9,
        tumbleScaleY: 1,
        alpha: 0,
        phase: 'waiting',
        bornAt: t + i * APPEAR_STAGGER,
        flyStartedAt: null,
        landed: false,
        landedAt: null,
        vanishStartedAt: null,
      };
      batch.push(letter);
      allLetters.push(letter);
    });
    activeBatches.set(batchId, batch);

    const fallStart = Math.max(duration - 0.1, 0.15);
    setTimeout(() => dropBatch(batchId), fallStart * 1000);
  }

  function scheduleChunk(text, duration, delay, gen) {
    if (delay <= 0) { showNow(text, duration, gen); return; }
    setTimeout(() => showNow(text, duration, gen), delay * 1000);
  }

  function showText(text, duration) {
    if (!text) return;
    const tokens = tokenize(text);
    log('showText: ' + JSON.stringify(text) + ' -> ' + tokens.length + ' tokens, duration=' + duration.toFixed(2));
    if (tokens.length === 0) return;
    const groups = [];
    for (let i = 0; i < tokens.length; i += WORDS_PER_CHUNK) {
      groups.push(tokens.slice(i, i + WORDS_PER_CHUNK));
    }
    generation++;
    const myGen = generation;
    const totalTokens = Math.max(tokens.length, 1);
    let offset = 0;
    for (const group of groups) {
      const chunkDuration = Math.max(duration * group.length / totalTokens, MIN_CHUNK_HOLD);
      scheduleChunk(joinTokens(group), chunkDuration, offset, myGen);
      offset += chunkDuration;
    }
  }

  function hideText() {
    log('hideText: dropping ' + activeBatches.size + ' active batch(es)');
    generation++;
    for (const [batchId] of activeBatches) dropBatch(batchId);
  }

  window.setSubtitle = function (text) {
    log('setSubtitle called: ' + JSON.stringify(text));
    const trimmed = (text || '').trim();
    if (!trimmed) { hideText(); return; }
    let cjkCount = 0, wordCount = 0;
    for (const tok of tokenize(trimmed)) {
      if (isCjkToken(tok)) cjkCount++; else wordCount++;
    }
    const duration = Math.max(cjkCount / CJK_CHARS_PER_SECOND + wordCount / WORDS_PER_SECOND, 0.6);
    showText(trimmed, duration);
  };

  function drawLetter(letter) {
    if (letter.alpha <= 0.003) return;
    ctx.save();
    ctx.translate(letter.x, letter.y);
    ctx.rotate(letter.rot);
    ctx.scale(letter.popScale, letter.popScale * letter.tumbleScaleY);
    ctx.globalAlpha = letter.alpha;
    ctx.font = `${FONT_WEIGHT} ${FONT_SIZE}px ${FONT_STACK}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = OUTLINE_SIZE;
    ctx.strokeText(letter.char, 0, 0);
    ctx.fillStyle = TEXT_COLOR;
    ctx.fillText(letter.char, 0, 0);
    ctx.restore();
  }

  function updateAndDraw(dt) {
    for (let i = allLetters.length - 1; i >= 0; i--) {
      const letter = allLetters[i];

      if (letter.phase === 'waiting') {
        if (t < letter.bornAt) continue;
        letter.phase = 'flying';
        letter.flyStartedAt = t;
      }

      if (letter.phase === 'flying') {
        const p = clamp01((t - letter.flyStartedAt) / 0.4);
        letter.popScale = 1.9 + (1.0 - 1.9) * easeOutBack(p);
        const pr = clamp01((t - letter.flyStartedAt) / 0.3);
        letter.rot = letter.rot0 * (1 - easeOutSine(pr));
        const pa = clamp01((t - letter.flyStartedAt) / 0.15);
        letter.alpha = pa;
        if (p >= 1 && pr >= 1 && pa >= 1) {
          letter.phase = 'standing';
          letter.popScale = 1;
          letter.rot = 0;
          letter.alpha = 1;
        }
      } else if (letter.phase === 'falling') {
        if (!letter.landed) {
          const GRAVITY = 700;
          letter.vy += GRAVITY * dt;
          letter.x += letter.vx * dt;
          letter.y += letter.vy * dt;
          letter.rot += letter.angVel * dt;
          if (letter.y >= floorY()) {
            letter.y = floorY();
            letter.vy = 0;
            letter.vx *= 0.35;
            letter.landed = true;
            letter.landedAt = t;
          }
        } else {
          letter.vx *= Math.pow(0.001, dt);
          letter.x += letter.vx * dt;
        }
        updateTumble(letter, dt);
        if (letter.landed && (t - letter.landedAt) >= FALL_SETTLE_TIME) {
          letter.phase = 'vanishing';
          letter.vanishStartedAt = t;
        }
      } else if (letter.phase === 'vanishing') {
        const p = clamp01((t - letter.vanishStartedAt) / VANISH_FADE_TIME);
        letter.alpha = 1 - p;
        letter.popScale = 1 - easeInBack(p);
        if (p >= 1) letter.phase = 'dead';
      }

      if (letter.phase === 'dead') {
        allLetters.splice(i, 1);
        continue;
      }
      drawLetter(letter);
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    ctx.clearRect(0, 0, W, H);
    updateAndDraw(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
